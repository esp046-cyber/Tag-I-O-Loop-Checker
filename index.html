<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Loop Checker — Tag &amp; I/O Verification</title>
<meta name="theme-color" content="#0b1015">
<meta name="description" content="Field tool for verifying instrument tags and I/O against PLC addresses.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loop Checker">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #0b1015;
    --panel: #151b21;
    --panel-alt: #1b2229;
    --border: #262f38;
    --border-soft: #1e262d;
    --text: #eef2f5;
    --text-dim: #93a2ac;
    --text-faint: #5b6a74;

    --cyan: #34d1c4;
    --cyan-dim: #1c8f86;

    --checked: #10b981;
    --checked-bg: rgba(16, 185, 129, 0.12);
    --forced: #f59e0b;
    --forced-bg: rgba(245, 158, 11, 0.12);
    --fault: #ef4444;
    --fault-bg: rgba(239, 68, 68, 0.13);
    --unset: #64748b;
    --unset-bg: rgba(100, 116, 139, 0.12);

    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;

    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-data: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    overscroll-behavior-y: none;
  }

  body {
    background-image: radial-gradient(circle at 20% 0%, rgba(52, 209, 196, 0.07), transparent 45%);
  }

  button, input, textarea, select { font-family: inherit; }
  button { -webkit-appearance: none; appearance: none; }

  .app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    padding-bottom: calc(90px + var(--safe-bottom));
  }

  /* ---------------- Header (glass, safe-area aware) ---------------- */

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(14px + var(--safe-top)) 18px 14px;
    background: rgba(11, 16, 21, 0.72);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-soft);
  }

  .topbar-title { display: flex; align-items: center; gap: 12px; min-width: 0; }

  .logo-mark {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 0 3px rgba(52, 209, 196, 0.18);
    flex-shrink: 0;
  }

  .topbar h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .subtitle { margin: 1px 0 0; font-size: 12px; color: var(--text-dim); font-family: var(--font-data); transition: color 0.2s ease; }
  .subtitle.saved { color: var(--checked); }

  .icon-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 38px;
    height: 38px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn.active { color: var(--cyan); border-color: var(--cyan); background: rgba(52, 209, 196, 0.1); }

  .content { padding: 16px 18px 0; }

  /* ---------------- Segmented filter/counter tabs ---------------- */

  .segmented {
    position: relative;
    display: flex;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 4px;
    gap: 2px;
  }

  .seg-indicator {
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: calc((100% - 8px) / 5);
    border-radius: 9px;
    background: var(--panel-alt);
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 0;
    pointer-events: none;
  }

  .seg-tab {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 9px 2px;
    background: none;
    border: none;
    cursor: pointer;
    border-radius: 9px;
    min-width: 0;
  }
  .seg-tab:active { opacity: 0.7; }

  .seg-num {
    font-family: var(--font-data);
    font-weight: 600;
    font-size: 15px;
    color: var(--text-dim);
    transition: color 0.2s ease;
  }
  .seg-label {
    font-size: 9.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    transition: color 0.2s ease;
    white-space: nowrap;
  }

  .seg-tab.active .seg-num,
  .seg-tab.active .seg-label { color: var(--seg-color, var(--cyan)); }

  /* ---------------- Search + sort ---------------- */

  .searchbar { display: flex; gap: 8px; margin-top: 12px; }

  .search-wrap { position: relative; flex-grow: 1; min-width: 0; }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }

  #searchInput {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    padding: 11px 12px 11px 36px;
    border-radius: var(--radius-md);
    outline: none;
  }
  #searchInput:focus { border-color: var(--cyan-dim); }
  #searchInput::placeholder { color: var(--text-faint); }

  .sort-trigger {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 500;
    padding: 0 12px;
    border-radius: var(--radius-md);
    cursor: pointer;
  }
  .sort-trigger:active { transform: scale(0.97); }

  /* ---------------- Sort popover ---------------- */

  .popover-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 60;
  }
  .popover-backdrop.open { display: block; }

  .popover {
    position: absolute;
    right: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 6px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    min-width: 168px;
  }

  .popover-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .popover-item:active { background: var(--panel-alt); }
  .popover-item.active { color: var(--cyan); font-weight: 600; }

  /* ---------------- List + cards ---------------- */

  .list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 1.5px solid var(--unset);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .card[data-status="checked"] { border-left-color: var(--checked); }
  .card[data-status="forced"] { border-left-color: var(--forced); }
  .card[data-status="fault"] { border-left-color: var(--fault); }

  .card-head {
    width: 100%;
    background: none;
    border: none;
    color: inherit;
    text-align: left;
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .card-head:active { background: var(--panel-alt); }

  .card-head-main { flex-grow: 1; min-width: 0; }
  .card-tag { font-family: var(--font-data); font-size: 14px; font-weight: 600; color: var(--text); }
  .card-desc {
    font-size: 12.5px; font-weight: 400; color: var(--text-dim); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-desc.placeholder { font-style: italic; color: var(--text-faint); }

  .badge {
    font-family: var(--font-data);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 4px 8px;
    border-radius: 6px;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .badge-unset { background: var(--unset-bg); color: var(--unset); }
  .badge-checked { background: var(--checked-bg); color: var(--checked); }
  .badge-forced { background: var(--forced-bg); color: var(--forced); }
  .badge-fault { background: var(--fault-bg); color: var(--fault); }

  .card-chevron { color: var(--text-faint); flex-shrink: 0; transition: transform 0.15s ease; }
  .card.open .card-chevron { transform: rotate(180deg); }

  .card-select-box {
    flex-shrink: 0; width: 20px; height: 20px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-alt);
    display: flex; align-items: center; justify-content: center;
  }
  .card-select-box svg { display: none; }
  .card.selected .card-select-box { background: var(--cyan); border-color: var(--cyan); }
  .card.selected .card-select-box svg { display: block; color: #062522; }

  .card-body { display: none; padding: 2px 14px 14px; border-top: 1px solid var(--border-soft); }
  .card.open .card-body { display: block; }

  .card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 12px 0; font-size: 12.5px; }
  .card-meta div span { display: block; color: var(--text-faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }
  .card-meta div strong { font-family: var(--font-data); font-weight: 500; color: var(--text); }

  .status-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .status-btn {
    font-size: 12.5px; font-weight: 600; padding: 9px 4px; min-height: 44px;
    border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--panel-alt); color: var(--text-dim); cursor: pointer;
  }
  .status-btn:active { transform: scale(0.97); }
  .status-btn[data-s="checked"].active { background: var(--checked-bg); border-color: var(--checked); color: var(--checked); }
  .status-btn[data-s="forced"].active { background: var(--forced-bg); border-color: var(--forced); color: var(--forced); }
  .status-btn[data-s="fault"].active { background: var(--fault-bg); border-color: var(--fault); color: var(--fault); }

  /* Value / process reading fields */
  .value-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .value-field { display: flex; flex-direction: column; gap: 4px; }
  .value-field span { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; }
  .value-input {
    background: var(--panel-alt); border: 1px solid var(--border); color: var(--text);
    font-family: var(--font-data); font-size: 13px; padding: 9px 10px; border-radius: var(--radius-sm);
    outline: none; min-height: 40px;
  }
  .value-input:focus { border-color: var(--cyan-dim); }
  .value-input::placeholder { color: var(--text-faint); font-family: var(--font-ui); }

  .photo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .photo-btn {
    display: inline-flex; align-items: center; gap: 6px; background: var(--panel-alt);
    border: 1px dashed var(--border); color: var(--text-dim); font-size: 12.5px; font-weight: 500;
    padding: 9px 12px; border-radius: var(--radius-sm); cursor: pointer; min-height: 40px;
  }
  .photo-thumb-wrap { position: relative; flex-shrink: 0; }
  .photo-thumb { width: 52px; height: 52px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: pointer; }
  .photo-remove {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--fault); color: #2a0a0b; border: none; font-size: 12px; line-height: 1; cursor: pointer;
  }
  .photo-lightbox {
    display: none; position: fixed; inset: 0; background: rgba(4, 7, 9, 0.92);
    align-items: center; justify-content: center; z-index: 90; padding: 24px;
  }
  .photo-lightbox.open { display: flex; }
  .photo-lightbox img { max-width: 100%; max-height: 100%; border-radius: var(--radius-md); }

  .notes-row { display: flex; gap: 8px; align-items: flex-start; }
  .notes-field {
    flex-grow: 1; width: 100%; background: var(--panel-alt); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; padding: 9px 10px; border-radius: var(--radius-sm);
    resize: vertical; min-height: 56px; outline: none;
  }
  .notes-field:focus { border-color: var(--cyan-dim); }
  .mic-btn {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--panel-alt); color: var(--text-dim);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .mic-btn.listening { color: var(--fault); border-color: var(--fault); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.3); } 50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } }

  .card-footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .timestamp { font-size: 11px; color: var(--text-faint); font-family: var(--font-data); }
  .delete-link { background: none; border: none; color: var(--text-faint); font-size: 11px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

  .empty-state { display: none; text-align: center; color: var(--text-dim); font-size: 13px; padding: 48px 30px; line-height: 1.6; }
  .empty-state.visible { display: block; }

  /* ---------------- Bulk selection bar ---------------- */

  .bulk-bar {
    display: none;
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(18px + var(--safe-bottom));
    width: calc(100% - 36px);
    max-width: 604px;
    background: var(--panel-alt);
    border: 1px solid var(--cyan-dim);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    z-index: 30;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  }
  .bulk-bar.visible { display: flex; }
  .bulk-actions { display: flex; gap: 6px; }
  .bulk-btn {
    font-size: 12.5px; font-weight: 600; padding: 9px 12px; min-height: 40px;
    border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: pointer;
    background: var(--panel); color: var(--text);
  }
  .bulk-cancel { color: var(--text-dim); }

  /* ---------------- FAB ---------------- */

  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(24px + var(--safe-bottom));
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--cyan);
    color: #062522;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(52, 209, 196, 0.35), 0 2px 8px rgba(0, 0, 0, 0.3);
    z-index: 40;
  }
  .fab:active { transform: scale(0.93); }
  .fab.hidden-fab { display: none; }

  /* ---------------- Bottom sheets ---------------- */

  .sheet-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(4, 7, 9, 0.6);
    z-index: 70;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet-backdrop.open { display: flex; }

  .sheet {
    background: var(--panel);
    width: 100%;
    max-width: 480px;
    border-radius: 22px 22px 0 0;
    padding: 8px 18px calc(18px + var(--safe-bottom));
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 82vh;
    overflow-y: auto;
    animation: sheet-up 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes sheet-up { from { transform: translateY(24px); opacity: 0.6; } to { transform: translateY(0); opacity: 1; } }

  .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 8px auto 12px; flex-shrink: 0; }

  .sheet h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; padding: 0 4px; }

  .sheet-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 8px;
    background: none; border: none; color: var(--text); font-size: 15px;
    text-align: left; border-radius: var(--radius-sm); cursor: pointer; min-height: 44px;
  }
  .sheet-item:active { background: var(--panel-alt); }
  .sheet-item svg { flex-shrink: 0; color: var(--text-dim); }
  .sheet-item-danger { color: var(--fault); }
  .sheet-item-danger svg { color: var(--fault); }

  .sheet .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 4px; }
  .sheet label { font-size: 11px; color: var(--text-dim); display: flex; flex-direction: column; gap: 5px; }
  .sheet .field-full { grid-column: 1 / -1; padding: 10px 4px 0; }
  .sheet input {
    background: var(--panel-alt); border: 1px solid var(--border); color: var(--text);
    font-family: var(--font-data); font-size: 14px; padding: 10px; border-radius: var(--radius-sm);
    outline: none; min-height: 44px;
  }
  .sheet input:focus { border-color: var(--cyan-dim); }

  .sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; padding: 0 4px; }
  .btn-ghost, .btn-solid {
    font-size: 14px; font-weight: 600; padding: 11px 16px; min-height: 44px;
    border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--border);
  }
  .btn-ghost { background: none; color: var(--text-dim); }
  .btn-solid { background: var(--cyan); border-color: var(--cyan); color: #062522; }

  /* ---------------- Handover modal ---------------- */

  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(4, 7, 9, 0.7);
    z-index: 80;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  @media (min-width: 560px) { .modal-backdrop.open { align-items: center; } }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    width: 100%;
    max-width: 480px;
    padding: 18px 18px calc(18px + var(--safe-bottom));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  @media (min-width: 560px) { .modal { border-radius: var(--radius-lg); } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; }
  .modal-head h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .handover-text {
    width: 100%; min-height: 220px; background: var(--panel-alt); border: 1px solid var(--border);
    color: var(--text); font-family: var(--font-data); font-size: 12.5px; line-height: 1.6;
    padding: 12px; border-radius: var(--radius-sm); resize: vertical;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .card-chevron, .seg-indicator, .sheet { transition: none; animation: none; }
  }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-title">
      <span class="logo-mark" aria-hidden="true"></span>
      <div>
        <h1>Loop Checker</h1>
        <p class="subtitle" id="saveIndicator">Tag &amp; I/O verification</p>
      </div>
    </div>
    <button class="icon-btn" id="menuToggle" aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div class="content">
    <div class="segmented" id="segmented"></div>

    <div class="searchbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16" class="search-icon"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Search tag, description, or address">
      </div>
      <button class="sort-trigger" id="sortTrigger">
        <span id="sortTriggerLabel">Default</span>
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </div>

    <main class="list" id="tagList" aria-live="polite"></main>
    <p class="empty-state" id="emptyState">No tags match this view. Import a CSV or add a tag to get started.</p>
  </div>

  <button class="fab" id="fabAdd" aria-label="Add tag">
    <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <div class="bulk-bar" id="bulkBar">
    <span id="bulkCount">0 selected</span>
    <div class="bulk-actions">
      <button class="bulk-btn" data-s="checked">Mark checked</button>
      <button class="bulk-btn" data-s="forced">Mark forced</button>
      <button class="bulk-btn bulk-cancel" id="bulkCancel">Cancel</button>
    </div>
  </div>

</div>

<!-- Sort popover -->

<script>
(function () {
  "use strict";

  /* ---------------- Haptics ---------------- */
  // Android Chrome supports the Vibration API; iOS Safari does not expose it
  // to web content at all (no fallback exists), so this is a silent no-op there.
  function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms || 30); } catch (e) {}
  }

  /* ---------------- Storage ---------------- */

  const STORAGE_KEY = "loopchecker.tags.v2";
  const storageAvailable = (() => {
    try { const k = "__lc_test__"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  })();

  const SEED_TAGS = [
    { tag: "FT-101", desc: "Flow transmitter — chiller header", plc: "Siemens S7", addr: "DB10.DBD24", status: "checked", notes: "Verified against BTU meter reading.", updated: "2026-09-10 08:14", photo: null, raw: "12.3 mA", pv: "45.2 GPM" },
    { tag: "PT-204", desc: "Pressure transmitter — condenser return", plc: "Rockwell CLX", addr: "N7:22", status: "fault", notes: "Reads 0 psi, physical gauge shows 42 psi. Suspect wiring.", updated: "2026-09-11 14:02", photo: null, raw: "0.0 mA", pv: "42 psi (actual)" },
    { tag: "TT-118", desc: "Temp transmitter — supply header, District Cooling Plant 3", plc: "ABB AC500", addr: "%MW118", status: "forced", notes: "Forced to 6.5°C while sensor is on order.", updated: "2026-09-11 09:47", photo: null, raw: "", pv: "6.5 °C (forced)" },
    { tag: "PU-301-RUN", desc: "Primary pump 1 — run feedback", plc: "Siemens S7", addr: "DB12.DBX2.0", status: "checked", notes: "", updated: "2026-09-09 16:20", photo: null, raw: "", pv: "" },
    { tag: "PU-301-FLT", desc: "Primary pump 1 — fault relay", plc: "Siemens S7", addr: "DB12.DBX2.1", status: "unset", notes: "", updated: "", photo: null, raw: "", pv: "" },
    { tag: "LSH-410", desc: "High level switch — cold water tank, Pumping Station 2", plc: "Rockwell CLX", addr: "N7:41", status: "unset", notes: "", updated: "", photo: null, raw: "", pv: "" },
  ];

  function loadTags() {
    if (storageAvailable) {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          // Backfill fields for tags saved before raw/pv existed.
          return parsed.map((t) => ({ raw: "", pv: "", photo: null, ...t }));
        }
      } catch (e) { /* fall through to seed */ }
    }
    return SEED_TAGS.map((t) => ({ ...t }));
  }

  let saveTimer = null;
  function saveTags() {
    if (!storageAvailable) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tags));
        flashSaved();
      } catch (e) {
        flashSaved("Storage full — export CSV to keep this");
      }
    }, 150);
  }

  function flashSaved(msg) {
    const node = document.getElementById("saveIndicator");
    if (!node) return;
    node.textContent = msg || "Saved to this device";
    node.classList.add("saved");
    clearTimeout(flashSaved._t);
    flashSaved._t = setTimeout(() => {
      node.textContent = "Tag & I/O verification";
      node.classList.remove("saved");
    }, 1400);
  }

  /* ---------------- State ---------------- */

  let tags = loadTags();
  let activeFilter = "all";
  let searchTerm = "";
  let sortMode = "default";
  let openTagId = null;
  let selectMode = false;
  let selectedTags = new Set();
  let recognizer = null;
  let listeningForTag = null;

  const el = {
    list: document.getElementById("tagList"),
    empty: document.getElementById("emptyState"),
    segmented: document.getElementById("segmented"),
    search: document.getElementById("searchInput"),
    sortTrigger: document.getElementById("sortTrigger"),
    sortTriggerLabel: document.getElementById("sortTriggerLabel"),
    sortPopoverBackdrop: document.getElementById("sortPopoverBackdrop"),
    sortPopover: document.getElementById("sortPopover"),
    menuToggle: document.getElementById("menuToggle"),
    menuSheetBackdrop: document.getElementById("menuSheetBackdrop"),
    addSheetBackdrop: document.getElementById("addSheetBackdrop"),
    fabAdd: document.getElementById("fabAdd"),
    csvInput: document.getElementById("csvInput"),
    photoInput: document.getElementById("photoInput"),
    sheetImport: document.getElementById("sheetImport"),
    sheetExport: document.getElementById("sheetExport"),
    sheetSelect: document.getElementById("sheetSelect"),
    sheetHandover: document.getElementById("sheetHandover"),
    sheetClear: document.getElementById("sheetClear"),
    handoverModal: document.getElementById("handoverModal"),
    handoverText: document.getElementById("handoverText"),
    handoverClose: document.getElementById("handoverClose"),
    handoverCopy: document.getElementById("handoverCopy"),
    handoverShare: document.getElementById("handoverShare"),
    bulkBar: document.getElementById("bulkBar"),
    bulkCount: document.getElementById("bulkCount"),
    bulkCancel: document.getElementById("bulkCancel"),
    photoLightbox: document.getElementById("photoLightbox"),
    photoLightboxImg: document.getElementById("photoLightboxImg"),
  };

  const STATUS_LABEL = { unset: "Unchecked", checked: "Checked", forced: "Forced", fault: "Fault" };
  const SEG_ORDER = ["all", "checked", "forced", "fault", "unset"];
  const SEG_COLOR_VAR = { all: "var(--cyan)", checked: "var(--checked)", forced: "var(--forced)", fault: "var(--fault)", unset: "var(--unset)" };
  const SORT_LABEL = { default: "Default", "fault-first": "Fault first", name: "Tag name", updated: "Updated" };
  const speechSupported = "webkitSpeechRecognition" in window || "SpeechRecognition" in window;

  /* ---------------- Rendering ---------------- */

  function render() {
    renderSegmented();
    renderList();
    renderBulkBar();
  }

  function renderSegmented() {
    const counts = { checked: 0, forced: 0, fault: 0, unset: 0 };
    tags.forEach((t) => counts[t.status]++);
    const totals = { all: tags.length, ...counts };

    el.segmented.innerHTML = `
      <div class="seg-indicator" id="segIndicator"></div>
      ${SEG_ORDER.map((key) => `
        <button class="seg-tab${activeFilter === key ? " active" : ""}" data-filter="${key}" style="--seg-color:${SEG_COLOR_VAR[key]}">
          <span class="seg-num">${totals[key]}</span>
          <span class="seg-label">${key === "all" ? "All" : STATUS_LABEL[key]}</span>
        </button>
      `).join("")}
    `;

    const idx = SEG_ORDER.indexOf(activeFilter);
    document.getElementById("segIndicator").style.transform = `translateX(${idx * 100}%)`;

    el.segmented.querySelectorAll(".seg-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        buzz(20);
        render();
      });
    });
  }

  function matchesFilter(t) { return activeFilter === "all" || t.status === activeFilter; }
  function matchesSearch(t) {
    if (!searchTerm) return true;
    return `${t.tag} ${t.desc} ${t.addr} ${t.plc}`.toLowerCase().includes(searchTerm);
  }

  function sortTags(list) {
    const arr = [...list];
    const rank = { fault: 0, forced: 1, unset: 2, checked: 3 };
    if (sortMode === "fault-first") arr.sort((a, b) => rank[a.status] - rank[b.status]);
    else if (sortMode === "name") arr.sort((a, b) => a.tag.localeCompare(b.tag, undefined, { numeric: true }));
    else if (sortMode === "updated") arr.sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
    return arr;
  }

  function renderList() {
    const visible = sortTags(tags.filter((t) => matchesFilter(t) && matchesSearch(t)));
    el.list.innerHTML = "";
    el.empty.classList.toggle("visible", visible.length === 0);

    visible.forEach((t) => {
      const card = document.createElement("div");
      card.className = "card" + (openTagId === t.tag ? " open" : "") + (selectedTags.has(t.tag) ? " selected" : "");
      card.dataset.status = t.status;
      card.dataset.tag = t.tag;

      const selectBoxHtml = selectMode
        ? `<span class="card-select-box"><svg viewBox="0 0 24 24" width="13" height="13"><path d="M5 12l4 4 10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span>`
        : `<svg class="card-chevron" viewBox="0 0 24 24" width="16" height="16"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;

      const descHtml = t.desc
        ? escapeHtml(t.desc)
        : `<span class="desc-placeholder">No description</span>`;

      card.innerHTML = `
        <button class="card-head" data-action="toggle">
          <div class="card-head-main">
            <div class="card-tag">${escapeHtml(t.tag)}</div>
            <div class="card-desc${t.desc ? "" : " placeholder"}">${t.desc ? escapeHtml(t.desc) : "No description"}</div>
          </div>
          <span class="badge badge-${t.status}">${STATUS_LABEL[t.status]}</span>
          ${selectBoxHtml}
        </button>
        <div class="card-body">
          <div class="card-meta">
            <div><span>PLC</span><strong>${escapeHtml(t.plc || "—")}</strong></div>
            <div><span>Address</span><strong>${escapeHtml(t.addr || "—")}</strong></div>
          </div>
          <div class="status-buttons">
            <button class="status-btn ${t.status === "checked" ? "active" : ""}" data-s="checked">Checked</button>
            <button class="status-btn ${t.status === "forced" ? "active" : ""}" data-s="forced">Forced</button>
            <button class="status-btn ${t.status === "fault" ? "active" : ""}" data-s="fault">Fault</button>
          </div>
          <div class="value-row">
            <label class="value-field"><span>Raw (mA / V)</span><input class="value-input" data-field="raw" value="${escapeHtml(t.raw || "")}" placeholder="e.g. 12.3 mA"></label>
            <label class="value-field"><span>Process value (EU)</span><input class="value-input" data-field="pv" value="${escapeHtml(t.pv || "")}" placeholder="e.g. 45.2 °C"></label>
          </div>
          <div class="photo-row">
            ${t.photo
              ? `<div class="photo-thumb-wrap">
                   <img class="photo-thumb" src="${t.photo}" data-action="view-photo" alt="Photo for ${escapeHtml(t.tag)}" tabindex="0" role="button" aria-label="View photo for ${escapeHtml(t.tag)}">
                   <button class="photo-remove" data-action="remove-photo" aria-label="Remove photo">&times;</button>
                 </div>`
              : `<button class="photo-btn" data-action="add-photo">
                   <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 8h3l2-3h6l2 3h3v12H4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/><circle cx="12" cy="14" r="3.2" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                   Add photo
                 </button>`
            }
          </div>
          <div class="notes-row">
            <textarea class="notes-field" placeholder="Notes — what did you observe, what needs follow-up?">${escapeHtml(t.notes || "")}</textarea>
            ${speechSupported ? `<button class="mic-btn" data-action="mic" aria-label="Dictate note">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="2" fill="none"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
            </button>` : ""}
          </div>
          <div class="card-footer-row">
            <span class="timestamp">${t.updated ? "Updated " + t.updated : "Not yet checked"}</span>
            <button class="delete-link" data-action="delete">Remove tag</button>
          </div>
        </div>
      `;

      wireCard(card, t);
      el.list.appendChild(card);
    });
  }

  function wireCard(card, t) {
    card.querySelector('[data-action="toggle"]').addEventListener("click", () => {
      if (selectMode) {
        if (selectedTags.has(t.tag)) selectedTags.delete(t.tag);
        else selectedTags.add(t.tag);
        buzz(15);
        render();
        return;
      }
      openTagId = openTagId === t.tag ? null : t.tag;
      buzz(15);
      render();
    });

    card.querySelectorAll(".status-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const s = btn.dataset.s;
        t.status = t.status === s ? "unset" : s;
        touch(t);
        buzz(25);
        saveTags();
        render();
      });
    });

    card.querySelectorAll(".value-input").forEach((input) => {
      input.addEventListener("change", () => {
        t[input.dataset.field] = input.value;
        touch(t);
        saveTags();
      });
    });

    const notesField = card.querySelector(".notes-field");
    if (notesField) {
      notesField.addEventListener("change", () => {
        t.notes = notesField.value;
        touch(t);
        saveTags();
      });
    }

    const deleteBtn = card.querySelector('[data-action="delete"]');
    if (deleteBtn) {
      deleteBtn.addEventListener("click", () => {
        tags = tags.filter((x) => x.tag !== t.tag);
        if (openTagId === t.tag) openTagId = null;
        saveTags();
        render();
      });
    }

    const addPhotoBtn = card.querySelector('[data-action="add-photo"]');
    if (addPhotoBtn) {
      addPhotoBtn.addEventListener("click", () => {
        el.photoInput.dataset.forTag = t.tag;
        el.photoInput.click();
      });
    }

    const viewPhoto = card.querySelector('[data-action="view-photo"]');
    if (viewPhoto) {
      viewPhoto.addEventListener("click", () => openLightbox(t.photo));
      viewPhoto.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLightbox(t.photo); }
      });
    }

    const removePhoto = card.querySelector('[data-action="remove-photo"]');
    if (removePhoto) {
      removePhoto.addEventListener("click", () => {
        t.photo = null;
        touch(t);
        saveTags();
        render();
      });
    }

    const micBtn = card.querySelector('[data-action="mic"]');
    if (micBtn) {
      micBtn.addEventListener("click", () => toggleDictation(micBtn, notesField, t));
    }
  }

  function touch(t) {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    t.updated = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* ---------------- Search + sort popover ---------------- */

  el.search.addEventListener("input", () => {
    searchTerm = el.search.value.trim().toLowerCase();
    renderList();
  });

  el.sortTrigger.addEventListener("click", () => {
    el.sortPopoverBackdrop.classList.add("open");
    positionPopover();
  });
  el.sortPopoverBackdrop.addEventListener("click", (e) => {
    if (e.target === el.sortPopoverBackdrop) el.sortPopoverBackdrop.classList.remove("open");
  });
  function positionPopover() {
    const rect = el.sortTrigger.getBoundingClientRect();
    el.sortPopover.style.top = (rect.bottom + 8) + "px";
  }
  el.sortPopover.addEventListener("click", (e) => {
    const btn = e.target.closest(".popover-item");
    if (!btn) return;
    sortMode = btn.dataset.sort;
    el.sortTriggerLabel.textContent = SORT_LABEL[sortMode];
    el.sortPopoverBackdrop.classList.remove("open");
    buzz(15);
    renderList();
  });
  window.addEventListener("resize", () => { if (el.sortPopoverBackdrop.classList.contains("open")) positionPopover(); });

  /* ---------------- Hamburger bottom sheet ---------------- */

  function openSheet(backdrop) { backdrop.classList.add("open"); buzz(15); }
  function closeSheet(backdrop) { backdrop.classList.remove("open"); }

  el.menuToggle.addEventListener("click", () => openSheet(el.menuSheetBackdrop));
  el.menuSheetBackdrop.addEventListener("click", (e) => {
    if (e.target === el.menuSheetBackdrop) closeSheet(el.menuSheetBackdrop);
  });

  el.sheetImport.addEventListener("click", () => { closeSheet(el.menuSheetBackdrop); el.csvInput.click(); });
  el.sheetExport.addEventListener("click", () => { closeSheet(el.menuSheetBackdrop); exportCsv(); });
  el.sheetSelect.addEventListener("click", () => {
    closeSheet(el.menuSheetBackdrop);
    selectMode = !selectMode;
    if (!selectMode) selectedTags.clear();
    render();
  });
  el.sheetHandover.addEventListener("click", () => {
    closeSheet(el.menuSheetBackdrop);
    el.handoverText.value = buildHandoverNote();
    el.handoverModal.classList.add("open");
  });
  el.sheetClear.addEventListener("click", () => {
    closeSheet(el.menuSheetBackdrop);
    if (tags.length === 0) return;
    if (confirm("Remove all tags from the current list? Export a CSV first if you want to keep them.")) {
      tags = [];
      openTagId = null;
      selectedTags.clear();
      saveTags();
      render();
    }
  });

  /* ---------------- FAB + add-tag sheet ---------------- */

  el.fabAdd.addEventListener("click", () => {
    buzz(20);
    document.getElementById("f_tag").value = "";
    document.getElementById("f_plc").value = "";
    document.getElementById("f_desc").value = "";
    document.getElementById("f_addr").value = "";
    openSheet(el.addSheetBackdrop);
    setTimeout(() => document.getElementById("f_tag").focus(), 250);
  });
  el.addSheetBackdrop.addEventListener("click", (e) => {
    if (e.target === el.addSheetBackdrop) closeSheet(el.addSheetBackdrop);
  });
  document.getElementById("f_cancel").addEventListener("click", () => closeSheet(el.addSheetBackdrop));
  document.getElementById("f_save").addEventListener("click", () => {
    const tagId = document.getElementById("f_tag").value.trim().toUpperCase();
    if (!tagId) { document.getElementById("f_tag").focus(); return; }
    if (tags.some((t) => t.tag.toLowerCase() === tagId.toLowerCase())) {
      alert(`Tag "${tagId}" already exists.`);
      return;
    }
    tags.unshift({
      tag: tagId,
      desc: document.getElementById("f_desc").value.trim(),
      plc: document.getElementById("f_plc").value.trim(),
      addr: document.getElementById("f_addr").value.trim(),
      status: "unset", notes: "", updated: "", photo: null, raw: "", pv: "",
    });
    closeSheet(el.addSheetBackdrop);
    buzz(30);
    saveTags();
    render();
  });

  /* ---------------- Select mode + bulk actions ---------------- */

  function renderBulkBar() {
    el.fabAdd.classList.toggle("hidden-fab", selectMode);
    if (!selectMode || selectedTags.size === 0) { el.bulkBar.classList.remove("visible"); return; }
    el.bulkBar.classList.add("visible");
    el.bulkCount.textContent = `${selectedTags.size} selected`;
  }

  el.bulkBar.addEventListener("click", (e) => {
    const btn = e.target.closest(".bulk-btn[data-s]");
    if (!btn) return;
    const s = btn.dataset.s;
    tags.forEach((t) => { if (selectedTags.has(t.tag)) { t.status = s; touch(t); } });
    selectedTags.clear();
    buzz(30);
    saveTags();
    render();
  });
  el.bulkCancel.addEventListener("click", () => { selectedTags.clear(); render(); });

  /* ---------------- Photo capture ---------------- */

  el.photoInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    const forTag = el.photoInput.dataset.forTag;
    if (!file || !forTag) return;
    const t = tags.find((x) => x.tag === forTag);
    if (!t) return;

    const reader = new FileReader();
    reader.onload = () => {
      resizeImage(reader.result, 900, 0.65).then((dataUrl) => {
        t.photo = dataUrl;
        touch(t);
        saveTags();
        render();
      });
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  });

  function resizeImage(dataUrl, maxDim, quality) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        try {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          if (!ctx) { resolve(dataUrl); return; }
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        } catch (err) { resolve(dataUrl); }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  function openLightbox(src) {
    el.photoLightboxImg.src = src;
    el.photoLightbox.classList.add("open");
  }
  el.photoLightbox.addEventListener("click", () => el.photoLightbox.classList.remove("open"));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") el.photoLightbox.classList.remove("open");
  });

  /* ---------------- Voice notes ---------------- */

  function toggleDictation(btn, notesField, t) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Voice dictation isn't supported in this browser."); return; }

    if (recognizer && listeningForTag === t.tag) { recognizer.stop(); return; }
    if (recognizer) recognizer.stop();

    const session = new SR();
    session.lang = "en-US";
    session.interimResults = false;
    session.maxAlternatives = 1;
    recognizer = session;
    listeningForTag = t.tag;
    btn.classList.add("listening");

    session.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      notesField.value = (notesField.value ? notesField.value + " " : "") + transcript;
      t.notes = notesField.value;
      touch(t);
      saveTags();
    };
    session.onerror = () => {
      btn.classList.remove("listening");
      if (recognizer === session) { recognizer = null; listeningForTag = null; }
    };
    session.onend = () => {
      btn.classList.remove("listening");
      if (recognizer === session) { recognizer = null; listeningForTag = null; }
    };
    try { session.start(); }
    catch (err) {
      btn.classList.remove("listening");
      if (recognizer === session) { recognizer = null; listeningForTag = null; }
    }
  }

  /* ---------------- Shift handover note ---------------- */

  if (!navigator.share) el.handoverShare.style.display = "none";

  el.handoverClose.addEventListener("click", () => el.handoverModal.classList.remove("open"));
  el.handoverModal.addEventListener("click", (e) => {
    if (e.target === el.handoverModal) el.handoverModal.classList.remove("open");
  });

  function buildHandoverNote() {
    const stamp = new Date().toLocaleString();
    const faults = tags.filter((t) => t.status === "fault");
    const forced = tags.filter((t) => t.status === "forced");
    const unchecked = tags.filter((t) => t.status === "unset");
    const checked = tags.filter((t) => t.status === "checked");

    let out = `LOOP CHECKER — SHIFT HANDOVER\n${stamp}\n\n`;
    out += `Checked ${checked.length}  |  Forced ${forced.length}  |  Fault ${faults.length}  |  Unchecked ${unchecked.length}\n\n`;

    if (faults.length) {
      out += `FAULTS — needs attention\n`;
      faults.forEach((t) => { out += `  ${t.tag}  ${t.desc || ""}${t.notes ? " — " + t.notes : ""}\n`; });
      out += `\n`;
    }
    if (forced.length) {
      out += `FORCED — remember to un-force once resolved\n`;
      forced.forEach((t) => { out += `  ${t.tag}  ${t.desc || ""}${t.notes ? " — " + t.notes : ""}\n`; });
      out += `\n`;
    }
    if (unchecked.length) {
      out += `NOT YET CHECKED (${unchecked.length})\n  ${unchecked.map((t) => t.tag).join(", ")}\n\n`;
    }
    out += `Checked and confirmed good: ${checked.length} of ${tags.length} tags.\n`;
    return out;
  }

  el.handoverCopy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(el.handoverText.value);
      el.handoverCopy.textContent = "Copied";
      buzz(20);
      setTimeout(() => (el.handoverCopy.textContent = "Copy"), 1200);
    } catch (e) {
      el.handoverText.select();
      document.execCommand("copy");
    }
  });
  el.handoverShare.addEventListener("click", async () => {
    if (navigator.share) {
      try { await navigator.share({ title: "Loop Checker handover", text: el.handoverText.value }); }
      catch (e) { /* user cancelled */ }
    }
  });

  /* ---------------- CSV import ---------------- */

  el.csvInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = parseCsv(reader.result);
        mergeImported(imported);
        saveTags();
        render();
      } catch (err) {
        alert("Could not read that CSV file. " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  function parseCsv(text) {
    const rows = splitCsvRows(text);
    if (rows.length < 2) throw new Error("File needs a header row and at least one data row.");

    const header = rows[0].map((h) => h.trim().toLowerCase());
    const col = (names) => names.map((n) => header.indexOf(n)).find((i) => i !== -1);

    const idx = {
      tag: col(["tag", "instrument tag", "tagname"]),
      desc: col(["description", "desc"]),
      plc: col(["plc", "plc type", "controller"]),
      addr: col(["address", "addr", "plc address"]),
      status: col(["status"]),
      notes: col(["notes", "note"]),
      raw: col(["raw", "raw value"]),
      pv: col(["pv", "process value"]),
    };

    if (idx.tag === undefined) throw new Error('No "Tag" column found in the header row.');
    const validStatus = ["unset", "checked", "forced", "fault"];

    return rows.slice(1)
      .filter((r) => r.some((c) => c.trim() !== ""))
      .map((r) => {
        const rawStatus = (idx.status !== undefined ? r[idx.status] || "" : "").trim().toLowerCase();
        return {
          tag: (r[idx.tag] || "").trim().toUpperCase(),
          desc: idx.desc !== undefined ? (r[idx.desc] || "").trim() : "",
          plc: idx.plc !== undefined ? (r[idx.plc] || "").trim() : "",
          addr: idx.addr !== undefined ? (r[idx.addr] || "").trim() : "",
          status: validStatus.includes(rawStatus) ? rawStatus : "unset",
          notes: idx.notes !== undefined ? (r[idx.notes] || "").trim() : "",
          raw: idx.raw !== undefined ? (r[idx.raw] || "").trim() : "",
          pv: idx.pv !== undefined ? (r[idx.pv] || "").trim() : "",
          updated: "", photo: null,
        };
      })
      .filter((t) => t.tag !== "");
  }

  function splitCsvRows(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
        else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n" || c === "\r") {
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(field); rows.push(row); row = []; field = "";
        } else field += c;
      }
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.length > 1 || r[0] !== "");
  }

  function mergeImported(imported) {
    let added = 0, updated = 0;
    imported.forEach((incoming) => {
      const existing = tags.find((t) => t.tag.toLowerCase() === incoming.tag.toLowerCase());
      if (existing) { Object.assign(existing, incoming, { tag: existing.tag, photo: existing.photo }); updated++; }
      else { tags.push(incoming); added++; }
    });
    alert(`Import complete: ${added} tag${added === 1 ? "" : "s"} added, ${updated} updated.`);
  }

  /* ---------------- CSV export ---------------- */

  function exportCsv() {
    const header = ["Tag", "Description", "PLC", "Address", "Status", "Notes", "Raw", "PV", "Updated"];
    const lines = [header.join(",")];
    tags.forEach((t) => {
      lines.push([t.tag, t.desc, t.plc, t.addr, t.status, t.notes, t.raw, t.pv, t.updated].map(csvEscape).join(","));
    });
    const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    a.href = url;
    a.download = `loop-checker-${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function csvEscape(val) {
    const s = String(val ?? "");
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }

  /* ---------------- Go ---------------- */

  render();
})();
</script>
</body>
</html>
